name: Tend CI

on:
  push:
    branches:
      - final-release
  pull_request:
    branches:
      - final-release

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Final release readiness check
        run: npm run release:check

      - name: Validate SAM template
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: SAM validate
        run: sam validate --template-file infra/template.yaml --lint
